<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ADL Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    padding:20px;
    background:
    linear-gradient(135deg,#650000,#b90000,#006b2c,#003d1c);
    color:#fff;
}

.container{
    width:100%;
    max-width:700px;
    margin:auto;
}

.box{
    background:#fff;
    color:#222;
    padding:20px;
    border-radius:20px;
    border:3px solid #ffd700;
    box-shadow:0 8px 30px rgba(0,0,0,.4);
    margin-bottom:18px;
}

h1{
    text-align:center;
    color:#9b0000;
    margin-bottom:18px;
}

h2{
    color:#9b0000;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:2px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:13px;
    margin-top:8px;
    border:0;
    border-radius:10px;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

.login-btn{
    background:#008f3c;
    color:white;
}

.logout-btn{
    background:#a00000;
    color:white;
}

.save-btn{
    background:#008f3c;
    color:white;
}

.status{
    text-align:center;
    padding:10px;
    margin-top:10px;
    border-radius:10px;
    font-weight:bold;
}

.round{
    border:2px solid #ddd;
    border-radius:15px;
    padding:15px;
    margin-bottom:12px;
    background:#fffbea;
}

.round-title{
    font-weight:bold;
    color:#9b0000;
    font-size:18px;
    margin-bottom:8px;
}

.time{
    color:#444;
    font-weight:bold;
    margin-bottom:5px;
}

.hidden{
    display:none;
}

.info{
    text-align:center;
    color:#555;
    margin-bottom:15px;
}

.user{
    text-align:center;
    color:#006b2c;
    font-weight:bold;
    margin-bottom:10px;
}

@media(max-width:600px){
    body{
        padding:10px;
    }

    .box{
        padding:15px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- LOGIN -->
    <div id="loginBox" class="box">

        <h1>🔐 ADL ADMIN LOGIN</h1>

        <input
            type="email"
            id="email"
            placeholder="Admin Email"
            autocomplete="email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button
            class="login-btn"
            onclick="login()"
        >
            🔐 Login
        </button>

        <div id="loginStatus" class="status"></div>

    </div>


    <!-- ADMIN PANEL -->
    <div id="adminBox" class="hidden">

        <div class="box">

            <h1>♛ ADL ADMIN PANEL ♛</h1>

            <div
                id="userEmail"
                class="user"
            ></div>

            <button
                class="logout-btn"
                onclick="logout()"
            >
                🚪 Logout
            </button>

        </div>


        <div class="box">

            <h2>📅 आज के Results</h2>

            <div class="info">
                Date:
                <b id="todayDate"></b>
            </div>

            <div id="rounds"></div>

        </div>

    </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://qgmfgycymbhsrkyjkhjy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_9eYJV-pHlQLKZ9gu24s-fg_RnfviCUO";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   ADMIN UID
========================= */

const ADMIN_UID =
"90f67bba-f300-465f-9041-fb7addc9bf45";


/* =========================
   TIME LIST
   12:00 PM TO 12:30 AM
   26 ROUNDS
========================= */

const roundTimes = [
    "12:00 PM",
    "12:30 PM",
    "1:00 PM",
    "1:30 PM",
    "2:00 PM",
    "2:30 PM",
    "3:00 PM",
    "3:30 PM",
    "4:00 PM",
    "4:30 PM",
    "5:00 PM",
    "5:30 PM",
    "6:00 PM",
    "6:30 PM",
    "7:00 PM",
    "7:30 PM",
    "8:00 PM",
    "8:30 PM",
    "9:00 PM",
    "9:30 PM",
    "10:00 PM",
    "10:30 PM",
    "11:00 PM",
    "11:30 PM",
    "12:00 AM",
    "12:30 AM"
];


/* =========================
   GET TODAY
========================= */

function getToday(){

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            now.getDate()
        ).padStart(2,"0");

    return `${year}-${month}-${day}`;
}


/* =========================
   LOGIN
========================= */

async function login(){

    const email =
        document.getElementById(
            "email"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;

    const status =
        document.getElementById(
            "loginStatus"
        );

    if(!email || !password){

        status.textContent =
            "⚠️ Email और Password डालें।";

        status.style.color =
            "#a00000";

        return;
    }

    status.textContent =
        "⏳ Login हो रहा है...";

    try{

        const {
            data,
            error
        } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if(error){

            console.error(error);

            status.textContent =
                "❌ Login failed: " +
                error.message;

            status.style.color =
                "#a00000";

            return;
        }

        if(
            !data.user ||
            data.user.id !== ADMIN_UID
        ){

            await supabaseClient.auth.signOut();

            status.textContent =
                "❌ यह account admin नहीं है।";

            status.style.color =
                "#a00000";

            return;
        }

        showAdmin(data.user);

    }catch(error){

        console.error(error);

        status.textContent =
            "❌ Login error.";

        status.style.color =
            "#a00000";
    }
}


/* =========================
   SHOW ADMIN
========================= */

function showAdmin(user){

    document.getElementById(
        "loginBox"
    ).classList.add("hidden");

    document.getElementById(
        "adminBox"
    ).classList.remove("hidden");

    document.getElementById(
        "userEmail"
    ).textContent =
        "👤 Logged in: " +
        user.email;

    document.getElementById(
        "todayDate"
    ).textContent =
        getToday();

    createRounds();

    loadTodayResults();
}


/* =========================
   CREATE 26 ROUNDS
========================= */

function createRounds(){

    const container =
        document.getElementById(
            "rounds"
        );

    container.innerHTML = "";

    for(
        let i = 1;
        i <= 26;
        i++
    ){

        container.innerHTML += `

            <div class="round">

                <div class="round-title">
                    🔴 Round ${i}
                </div>

                <div class="time">
                    🕐 ${roundTimes[i - 1]}
                </div>

                <input
                    type="text"
                    id="result-${i}"
                    placeholder="Result डालें"
                    maxlength="10"
                    inputmode="numeric"
                >

                <button
                    class="save-btn"
                    onclick="saveResult(${i})"
                >
                    💾 Round ${i} Save
                </button>

                <div
                    id="status-${i}"
                    class="status"
                ></div>

            </div>
        `;
    }
}


/* =========================
   CONVERT TIME
   TO DATABASE TIME
========================= */

function convertTimeToDB(time){

    let parts =
        time.split(" ");

    let hm =
        parts[0];

    let ampm =
        parts[1];

    let hmParts =
        hm.split(":");

    let hour =
        parseInt(
            hmParts[0],
            10
        );

    let minute =
        hmParts[1];

    if(ampm === "AM"){

        if(hour === 12){
            hour = 0;
        }

    }else{

        if(hour !== 12){
            hour += 12;
        }

    }

    return String(hour).padStart(2,"0")
        + ":" +
        minute +
        ":00";
}


/* =========================
   LOAD TODAY RESULTS
========================= */

async function loadTodayResults(){

    const today =
        getToday();

    try{

        const {
            data,
            error
        } = await supabaseClient
            .from("game_results")
            .select(
                "round_number,result"
            )
            .eq(
                "game_date",
                today
            )
            .order(
                "round_number",
                {
                    ascending:true
                }
            );

        if(error){

            console.error(error);

            return;
        }

        if(!data){
            return;
        }

        data.forEach(row => {

            const input =
                document.getElementById(
                    "result-" +
                    row.round_number
                );

            if(input){

                input.value =
                    row.result ?? "";

            }

        });

    }catch(error){

        console.error(error);
    }
}


/* =========================
   SAVE RESULT
========================= */

async function saveResult(round){

    const input =
        document.getElementById(
            "result-" + round
        );

    const statusBox =
        document.getElementById(
            "status-" + round
        );

    const result =
        input.value.trim();

    if(!result){

        statusBox.textContent =
            "⚠️ Result डालें।";

        statusBox.style.color =
            "#a00000";

        return;
    }


    statusBox.textContent =
        "⏳ Saving...";

    statusBox.style.color =
        "#555";


    try{

        const {
            data: sessionData
        } =
            await supabaseClient.auth.getSession();

        const user =
            sessionData.session?.user;

        if(
            !user ||
            user.id !== ADMIN_UID
        ){

            statusBox.textContent =
                "❌ Admin login required.";

            statusBox.style.color =
                "#a00000";

            return;
        }


        const gameDate =
            getToday();

        const gameTime =
            convertTimeToDB(
                roundTimes[round - 1]
            );


        const {
            error
        } = await supabaseClient
            .from("game_results")
            .upsert(
                {
                    round_number: round,
                    game_time: gameTime,
                    result: result,
                    game_date: gameDate,
                    status: "published"
                },
                {
                    onConflict:
                        "game_date,round_number"
                }
            );


        if(error){

            console.error(error);

            statusBox.textContent =
                "❌ Save failed: " +
                error.message;

            statusBox.style.color =
                "#a00000";

            return;
        }


        statusBox.textContent =
            "✅ Result Saved & Published";

        statusBox.style.color =
            "#008000";

    }catch(error){

        console.error(error);

        statusBox.textContent =
            "❌ Server error.";

        statusBox.style.color =
            "#a00000";
    }
}


/* =========================
   LOGOUT
========================= */

async function logout(){

    await supabaseClient.auth.signOut();

    document.getElementById(
        "adminBox"
    ).classList.add("hidden");

    document.getElementById(
        "loginBox"
    ).classList.remove("hidden");

    document.getElementById(
        "password"
    ).value = "";

    document.getElementById(
        "loginStatus"
    ).textContent = "";
}


/* =========================
   CHECK EXISTING SESSION
========================= */

async function checkSession(){

    const {
        data
    } =
        await supabaseClient.auth.getSession();

    const user =
        data.session?.user;

    if(
        user &&
        user.id === ADMIN_UID
    ){

        showAdmin(user);

    }

}


/* =========================
   START
========================= */

checkSession();

</script>

</body>
    </html>
