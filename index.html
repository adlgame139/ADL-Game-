   <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADL Results - Fast Updates</title>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-primary: #0f172a;        /* Deep Midnight Slate */
      --bg-card: #1e293b;           /* Elegant Card Background */
      --bg-card-alt: #24344d;       /* Alternate Row Color */
      --accent-gold: #f59e0b;       /* Gold / Yellow Accent */
      --accent-green: #10b981;      /* Live Green */
      --accent-red: #ef4444;        /* Live Indicator / Notice */
      --text-main: #f8fafc;         /* Crisp White Text */
      --text-muted: #94a3b8;        /* Soft Gray Muted Text */
      --border-color: #334155;      /* Subtle Borders */
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 30px;
    }

    /* Top Banner */
    .header {
      text-align: center;
      padding: 16px 10px;
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.9) 100%);
      border-bottom: 1px solid var(--border-color);
    }
    .header h1 {
      font-size: 26px;
      font-weight: 700;
      color: var(--accent-gold);
      letter-spacing: 1px;
    }
    .header p {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 2px;
      margin-top: 4px;
    }

    /* Marquee / Ticker */
    .ticker-bar {
      background: linear-gradient(90deg, #b91c1c, #dc2626, #b91c1c);
      color: #ffffff;
      padding: 7px 0;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      text-align: center;
      box-shadow: 0 2px 10px rgba(220, 38, 38, 0.3);
    }

    .container {
      max-width: 520px;
      margin: 15px auto;
      padding: 0 12px;
    }

    /* Latest Result Card */
    .latest-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 18px 14px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      margin-bottom: 20px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
    }
    .live-badge {
      background: rgba(16, 185, 129, 0.2);
      color: var(--accent-green);
      border: 1px solid var(--accent-green);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      background: var(--accent-green);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    .latest-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background: rgba(15, 23, 42, 0.6);
      padding: 12px 8px;
      border-radius: 10px;
      text-align: center;
    }
    .latest-item .label {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
    }
    .latest-item .value {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent-gold);
      margin-top: 4px;
    }
    .latest-item .value.result-highlight {
      color: var(--accent-green);
      font-size: 18px;
    }

    /* Table Section */
    .table-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }
    .table-header-title {
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 700;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .results-table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }
    .results-table th {
      background: #152238;
      color: var(--text-muted);
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 600;
      padding: 12px 6px;
      border-bottom: 1px solid var(--border-color);
    }
    .results-table td {
      padding: 12px 6px;
      font-size: 13px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.4);
      color: var(--text-main);
    }
    .results-table tr:nth-child(even) {
      background: rgba(15, 23, 42, 0.4);
    }
    .results-table td.col-round {
      font-weight: 700;
      color: var(--accent-gold);
    }
    .results-table td.col-date {
      color: var(--text-muted);
      font-size: 12px;
    }
    .results-table td.col-time {
      color: #cbd5e1;
      font-size: 12px;
    }
    .results-table td.col-result {
      font-weight: 700;
      color: var(--accent-green);
      font-size: 15px;
    }

    /* WhatsApp Button */
    .whatsapp-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #16a34a;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 13px;
      border-radius: 10px;
      margin-top: 20px;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
    }

    /* Footer */
    .footer {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 18px;
    }

    .loading-text {
      padding: 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>👑 ADL 👑</h1>
    <p>TRUSTED RESULTS • FAST UPDATES</p>
  </div>

  <div class="ticker-bar">
    ⚡ CHECK LATEST RESULTS • LIVE UPDATES ⚡
  </div>

  <div class="container">
    <!-- Latest Result Section -->
    <div class="latest-card">
      <div class="card-top">
        <span class="card-title">Latest Result</span>
        <span class="live-badge"><span class="live-dot"></span> LIVE</span>
      </div>
      <div class="latest-grid">
        <div class="latest-item">
          <div class="label">Date</div>
          <div class="value" id="latest-date">--</div>
        </div>
        <div class="latest-item">
          <div class="label">Round</div>
          <div class="value" id="latest-round">--</div>
        </div>
        <div class="latest-item">
          <div class="label">Time</div>
          <div class="value" id="latest-time">--</div>
        </div>
        <div class="latest-item">
          <div class="label">Result</div>
          <div class="value result-highlight" id="latest-result">--</div>
        </div>
      </div>
    </div>

    <!-- Results Table Section -->
    <div class="table-card">
      <div class="table-header-title">
        📊 Result Chart
      </div>
      <table class="results-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Round</th>
            <th>Time</th>
            <th>Result</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr>
            <td colspan="4" class="loading-text">Loading results...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- WhatsApp Contact Button -->
    <a href="https://wa.me/" class="whatsapp-btn" id="whatsapp-link" target="_blank">
      💬 WhatsApp Contact
    </a>

    <div class="footer">
      © 2026 👑 ADL 👑 — Results Information
    </div>
  </div>

  <script>
    // 1. Aapka Supabase Configuration
    const SUPABASE_URL = "AAPKA_SUPABASE_URL_YAHA_DALEIN";
    const SUPABASE_ANON_KEY = "AAPKI_SUPABASE_ANON_KEY_YAHA_DALEIN";
    
    // Supabase initialize
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function fetchResults() {
      try {
        // Table name aapke Supabase table ke anusar (e.g., 'results' ya jo bhi aapka table name hai)
        const { data, error } = await supabase
          .from('results')
          .select('*')
          .order('id', { ascending: false }); // Latest entry pehle aayegi

        if (error) throw error;

        if (data && data.length > 0) {
          // 1. Update Latest Result Card
          const latest = data[0];
          document.getElementById('latest-date').innerText = latest.date || '--';
          document.getElementById('latest-round').innerText = latest.round || '--';
          document.getElementById('latest-time').innerText = latest.time || '--';
          document.getElementById('latest-result').innerText = latest.result || '--';

          // 2. Populate Table Rows
          const tableBody = document.getElementById('table-body');
          tableBody.innerHTML = '';

          data.forEach(row => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="col-date">${row.date || '-'}</td>
              <td class="col-round">${row.round || '-'}</td>
              <td class="col-time">${row.time || '-'}</td>
              <td class="col-result">${row.result || '-'}</td>
            `;
            tableBody.appendChild(tr);
          });
        } else {
          document.getElementById('table-body').innerHTML = `
            <tr><td colspan="4" class="loading-text">No results found</td></tr>
          `;
        }
      } catch (err) {
        console.error('Error fetching data:', err);
        document.getElementById('table-body').innerHTML = `
          <tr><td colspan="4" class="loading-text" style="color: #ef4444;">Unable to load results. Check Supabase permissions.</td></tr>
        `;
      }
    }

    // Load results on page open
    fetchResults();

    // Auto-refresh every 30 seconds
    setInterval(fetchResults, 30000);
  </script>
</body>
    </html>
